<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verwonderlab Dashboard</title>
    <link rel="icon" type="image/jpeg" href="Verwonderlab.jpg">
    <link rel="stylesheet" href="style.css?v=20261118A">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .modal-content {
            max-height: 85vh;
            overflow-y: auto;
        }
    </style>
    <script>
        (function() {
            var email = localStorage.getItem("ww_huidige_email");
            var token = localStorage.getItem("ww_ms_id_token");
            var exp = parseInt(localStorage.getItem("ww_ms_token_exp") || "0", 10);
            var migrated = localStorage.getItem("ww_auth_v2_migrated") === "1";
            if (!migrated || !email || !token || (exp && Date.now() > exp) || !/@wonderwijs\.nl$/i.test(email)) {
                sessionStorage.setItem("ww_redirect_after_login", window.location.pathname + window.location.search);
                window.location.replace("/login");
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="appMount"></div>

<noscript>
    <div style="max-width: 480px; margin: 80px auto; padding: 24px; background: #fff; border-radius: 16px; text-align: center; font-family: sans-serif;">
        <h2>Authenticatie vereist</h2>
        <p>Log in via <a href="/login">login.html</a> om het Verwonderlab Portaal te openen.</p>
    </div>
</noscript>

<script src="auth-config.js?v=20261026e"></script>
<script src="auth.js?v=20261118I"></script>
<script src="script.js?v=20261118I"></script>
</body>
</html>
